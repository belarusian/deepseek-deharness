name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          pip install -e . pytest ruff mypy
      - name: Pytest
        run: pytest tests/ -x -q
      - name: Ruff
        run: ruff check deepseek_deharness/
      - name: Mypy
        run: mypy deepseek_deharness/ --ignore-missing-imports
